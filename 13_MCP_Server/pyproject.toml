[project]
name = "weather-mcp"
version = "0.1.0"
description = "A weather MCP server and client built with the MCP Python SDK."
readme = "README.md"
authors = [
    { name = "The-Tourist-170", email = "ayushya.official@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=2.2.0",
    "openai>=3.16.2",
    "python-dotenv>=1.0",
]

[project.scripts]
weather-mcp = "weather_mcp.server:main"
weather-client = "weather_mcp.client:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
