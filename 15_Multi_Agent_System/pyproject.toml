[project]
name = "multi-agent-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "The-Tourist-170", email = "ayushya.official@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "langchain[openai]>=1.4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/handoffs", "src/subagents", "src/multi_agent_system"]

[project.scripts]
multi-agent-system = "multi_agent_system:main"
subagents = "subagents:main"
calagent = "subagents.cal_agent:main"
emailagent = "subagents.email_agent:main"
handoffs = "handoffs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
