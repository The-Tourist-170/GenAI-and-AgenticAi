[project]
name = "16-guardrails"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "The-Tourist-170", email = "ayushya.official@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
]

[project.scripts]
16-guardrails = "16_guardrails:main"
pii-gr = "pii_gr:main"
hitl = "hitl:main"
custom-gr = "custom_gr:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/16_guardrails",
    "src/custom_gr",
    "src/hitl",
    "src/pii_gr",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
